# Builds the downloadable app (see packaging/build.py):
#   Windows: MusicRemover-Setup.exe
#   Linux:   MusicRemover-x86_64.AppImage and MusicRemover-linux-x86_64.tar.gz
# Pushing a tag like v1.0.0 attaches them to a GitHub release. Pull requests that touch
# the packaging build them too (downloadable from the run's artifacts) without releasing.
name: Release builds

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "server/requirements.txt"
      - "server/launcher.py"
      - "server/install.py"
      - "stop.sh"
      - "stop.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Older glibc: the pip packages bundled here then run on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop script
        # A stand-in server.py (listens on the server port) started like run.sh does;
        # stop.sh has to end it.
        run: |
          mkdir -p t/server && cp stop.sh t/
          printf 'import http.server\nhttp.server.HTTPServer(("127.0.0.1", 8765), http.server.SimpleHTTPRequestHandler).serve_forever()\n' > t/server/server.py
          python3 "$PWD/t/server/server.py" & sleep 2
          curl -sf -o /dev/null 127.0.0.1:8765/ && echo "server up"
          ./t/stop.sh
          sleep 1
          if curl -s -o /dev/null 127.0.0.1:8765/; then echo "still running"; exit 1; fi
          ./t/stop.sh | grep -q "isn't running"
      - run: python packaging/build.py linux
      - name: Smoke test
        run: build/linux/MusicRemover/python/bin/python3 -c "import fastapi, uvicorn, numpy, onnx, imageio_ffmpeg; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force t\server | Out-Null
          Copy-Item stop.bat t\
          Set-Content t\server\server.py 'import http.server; http.server.HTTPServer(("127.0.0.1", 8765), http.server.SimpleHTTPRequestHandler).serve_forever()'
          $p = Start-Process python -ArgumentList "`"$PWD\t\server\server.py`"" -PassThru
          Start-Sleep 3
          Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing | Out-Null; "server up"
          $out = cmd /c "t\stop.bat x"; $out
          Start-Sleep 1
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { "still running"; exit 1 }
          $out = cmd /c "t\stop.bat x"; $out
          if (-not ($out -match "isn't running")) { exit 1 }
      - run: python packaging/build.py windows
      - name: Smoke test
        run: build\windows\MusicRemover\python\python.exe -c "import fastapi, uvicorn, numpy, onnx, imageio_ffmpeg; print('ok')"
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev" }
          & $iscc "/DAppVersion=$version" packaging\windows\musicremover.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MusicRemover-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
